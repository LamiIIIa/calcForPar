<div id="allcalc">
  <h3 class="calch3">Калькулятор скилов</h3>
  <div id="firstp">
    <div class="leftpc">
      <h4 class="calch4">Ваш уровень:</h4>
      <input id="lvl" />
    </div>
    <div class="rightpartc">
      <h4 class="calch4">Очки за анкету:</h4>
      <input id="points" />
    </div>
    <button id="firstpb">Посчитать:</button>
  </div>

  <div id="secp">
    <h4 id="yhave" class="calch4"></h4>
    <p>Чакра: <input id="chakra" /></p>
    <p>Сила: <input id="strength" /></p>
    <p>Скорость: <input id="speed" /></p>
    <p>Тактика: <input id="tactics" /></p>
    <p>Ниндзютсу: <input id="nin" /></p>
    <p>Тайдзютсу: <input id="tai" /></p>
    <p>Гендзютсу: <input id="gen" /></p>
    <p>Фуиндзютсу: <input id="fuin" /></p>
    <p>Здоровье: <input id="health" /></p>
    <p>Знания: <input id="knowledge" /></p>
    <p>Защита вашего доспеха: <input id="armDef" /></p>
    <p>Урон от вашего оружия: <input id="weapDam" /></p>
    <h4 id="rest" class="calch4"></h4>

    <h4 class="calch4">Слоты под техники:</h4>
    <p id="rE"></p>
    <p id="rD"></p>
    <p id="rC"></p>
    <p id="rB"></p>
    <p id="rA"></p>
    <p id="rS"></p>
    <h4 class="calch4">Ваши параметры:</h4>
    <p id="HP"></p>
    <p id="EP"></p>
    <p id="atDam"></p>
    <p id="weapAtDam"></p>
    <p id="defense"></p>
    <p id="commonAct"></p>
    <p id="tecAct"></p>
    <p id="distAtt"></p>
    <p id="closeAtt"></p>
    <p id="ninAtt"></p>
    <p id="genAtt"></p>
    <p id="evasion"></p>
    <p id="genDef"></p>
    <p id="poisRes"></p>
    <h4 id="calch4">Код для вставки:</h4>
    <textarea id="codeSkils"></textarea>
  </div>
</div>
